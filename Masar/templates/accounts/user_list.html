{% extends "base.html" %}
{% block content %}
  <h2>User accounts</h2>
  <a href="{% url 'user_create' %}">+ New dispatcher</a>
  <table border="1" cellpadding="6">
    <tr><th>Username</th><th>Role</th><th>Status</th><th></th></tr>
    {% for u in users %}
    <tr>
      <td>{{ u.username }}</td>
      <td>{{ u.get_role_display }}</td>
      <td>{% if u.is_active %}Active{% else %}Deactivated{% endif %}</td>
      <td>
        {% if u != user %}
        <form method="post" action="{% url 'user_toggle_active' u.pk %}">
          {% csrf_token %}
          <button type="submit">{% if u.is_active %}Deactivate{% else %}Activate{% endif %}</button>
        </form>
        {% endif %}
      </td>
    </tr>
    {% endfor %}
  </table>
{% endblock %}
